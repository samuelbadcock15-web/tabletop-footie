<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tabletop Footie - Mobile & PC Touch Flick 3D Subbuteo</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; cursor: default; touch-action: none; }

        /* Matchmaking HUD Overlay */
        #matchmaking-overlay { position: absolute; inset: 0; background: rgba(8, 12, 20, 0.96); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .queue-box { background: #0f172a; border: 2px solid #00ffcc; border-radius: 24px; padding: 32px 24px; width: 420px; max-width: 88vw; text-align: center; box-shadow: 0 0 40px rgba(0, 255, 204, 0.25); color: #fff; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .game-title { font-size: 28px; font-weight: 900; color: #00ffcc; letter-spacing: 3px; }
        
        .pulse-loader { width: 38px; height: 38px; border: 4px solid rgba(0, 255, 204, 0.2); border-top-color: #00ffcc; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 6px 0; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status-text { font-size: 14px; font-weight: 800; color: #e2e8f0; letter-spacing: 1.5px; text-transform: uppercase; }
        #room-info-text { font-size: 16px; font-weight: 900; color: #ffff00; letter-spacing: 1px; display: none; }
        
        .ready-status-row { display: none; gap: 14px; font-size: 12px; font-weight: 800; margin: 4px 0; }
        .ready-badge { padding: 4px 12px; border-radius: 12px; border: 1px solid #334155; }
        .badge-blue { color: #38bdf8; border-color: #38bdf8; }
        .badge-red { color: #f87171; border-color: #f87171; }
        .is-ready { background: #10b981; color: #000 !important; border-color: #10b981 !important; }

        #ready-btn { display: none; width: 100%; padding: 14px; border-radius: 12px; background: #00ffcc; color: #000; font-size: 16px; font-weight: 900; letter-spacing: 2px; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,255,204,0.4); }
        #ready-btn:hover { background: #33ffd6; transform: scale(1.02); }
        #ready-btn:disabled { background: #334155; color: #94a3b8; cursor: default; transform: none; box-shadow: none; }

        /* Match Scoreboard */
        #scoreboard { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(10, 15, 20, 0.88); border: 2px solid #00ffcc; border-radius: 28px; padding: 6px 18px; color: #fff; display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 15px; z-index: 20; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2); pointer-events: none; }
        .score-blue { color: #3399ff; }
        .score-red { color: #ff4444; }
        #match-clock { color: #ffff00; font-family: monospace; font-size: 17px; min-width: 50px; text-align: center; }
        #match-status-badge { font-size: 11px; font-weight: 800; color: #00ffcc; background: rgba(0, 255, 204, 0.15); border: 1px solid rgba(0, 255, 204, 0.4); padding: 2px 8px; border-radius: 10px; letter-spacing: 1px; white-space: nowrap; }
        #active-room-tag { position: absolute; top: 14px; right: 14px; color: #00ffcc; background: rgba(15, 23, 42, 0.9); border: 1px solid #00ffcc; padding: 5px 12px; border-radius: 16px; font-size: 11px; font-weight: 900; z-index: 20; pointer-events: none; }

        /* TV Broadcast Letterbox Bars */
        .tv-bar { position: absolute; left: 0; width: 100%; height: 0; background: #000; z-index: 50; transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
        #tv-bar-top { top: 0; }
        #tv-bar-bottom { bottom: 0; }
        body.in-replay .tv-bar { height: 40px; }

        /* TV Replay HUD */
        #tv-replay-badge { position: absolute; top: 52px; left: 16px; display: none; align-items: center; gap: 10px; background: rgba(10, 15, 24, 0.92); border: 2px solid #ff3344; padding: 6px 12px; border-radius: 8px; z-index: 60; box-shadow: 0 0 20px rgba(255, 51, 68, 0.45); pointer-events: none; }
        #tv-rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3344; box-shadow: 0 0 8px #ff3344; animation: blink 0.7s infinite alternate; }
        #tv-cam-name { color: #ffffff; font-weight: 900; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-family: monospace; }
        #tv-slomo-tag { color: #ffff00; font-weight: 800; font-size: 9px; letter-spacing: 1px; border-left: 1px solid #475569; padding-left: 8px; }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        /* Match Stats & Highlight Vault */
        #vault-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 560px; max-width: 90vw; background: rgba(10, 15, 22, 0.96); border: 2px solid #00ffcc; border-radius: 18px; padding: 18px 20px; color: #fff; z-index: 80; display: none; flex-direction: column; gap: 10px; box-shadow: 0 0 40px rgba(0, 255, 204, 0.25); backdrop-filter: blur(12px); }
        #vault-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 255, 204, 0.25); padding-bottom: 6px; }
        #vault-title { font-size: 15px; font-weight: 900; color: #00ffcc; letter-spacing: 1px; }
        #vault-score-summary { font-size: 15px; font-weight: 900; }
        
        #stats-grid { display: flex; flex-direction: column; gap: 4px; background: rgba(15, 23, 42, 0.7); border: 1px solid #1e293b; border-radius: 8px; padding: 8px 12px; }
        .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .stats-val-player { color: #3399ff; font-weight: 800; min-width: 25px; text-align: left; }
        .stats-label { color: #94a3b8; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
        .stats-val-ai { color: #ff4444; font-weight: 800; min-width: 25px; text-align: right; }

        #vault-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; border-bottom: 1px solid #1e293b; }
        .vault-tab-btn { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; color: #94a3b8; padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .vault-tab-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; }

        #vault-content-list { display: flex; flex-direction: column; gap: 5px; max-height: 140px; overflow-y: auto; }
        .replay-item { background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #fff; cursor: pointer; }
        .replay-item:hover { border-color: #00ffcc; background: rgba(0, 255, 204, 0.12); }
        .replay-item-badge { font-weight: 900; font-size: 9px; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }
        .badge-goal { background: #eab308; color: #000; }
        .badge-corner { background: #3b82f6; color: #fff; }
        .badge-throw { background: #10b981; color: #fff; }

        #vault-footer { display: flex; justify-content: flex-end; }
        .vault-btn { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .vault-btn:hover { background: #334155; border-color: #00ffcc; color: #00ffcc; }

        /* Bottom Controls Tray */
        #bottom-controls { position: absolute; bottom: 18px; left: 18px; display: flex; gap: 10px; z-index: 45; }
        .hud-circle-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0, 20, 15, 0.85); border: 2px solid #00ffcc; color: #00ffcc; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(0,255,204,0.3); }

        #power-bar-container { position: absolute; top: 72%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 12px; background: rgba(0, 0, 0, 0.6); border: 2px solid #ffffff; border-radius: 6px; display: none; z-index: 25; overflow: hidden; pointer-events: none; }
        #power-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffcc 0%, #ffcc00 60%, #ff3300 100%); }
        #announcement-banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 34px; font-weight: 900; color: #ffff00; text-shadow: 0 0 20px rgba(255,255,0,0.8); z-index: 60; display: none; text-transform: uppercase; text-align: center; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- Matchmaking / Ready Overlay -->
    <div id="matchmaking-overlay">
        <div class="queue-box">
            <div class="game-title">TABLETOP FOOTIE</div>
            <div id="spinner" class="pulse-loader"></div>
            <div id="status-text">CONNECTING TO MATCHMAKER...</div>
            <div id="room-info-text">MATCH FOUND: ROOM 1</div>
            
            <div class="ready-status-row" id="ready-status-row">
                <span id="blue-ready-badge" class="ready-badge badge-blue">BLUE: WAITING</span>
                <span id="red-ready-badge" class="ready-badge badge-red">RED: WAITING</span>
            </div>

            <button id="ready-btn" onclick="sendReady()">READY UP</button>
        </div>
    </div>

    <div id="active-room-tag">ROOM: ...</div>
    <div id="tv-bar-top" class="tv-bar"></div>
    <div id="tv-bar-bottom" class="tv-bar"></div>
    <div id="canvas-container"></div>
    
    <div id="scoreboard">
        <span class="score-blue">BLUE: <span id="player-score">0</span></span>
        <span style="color: #777;">|</span>
        <span id="match-status-badge">1ST HALF</span>
        <span id="match-clock">90:00</span>
        <span style="color: #777;">|</span>
        <span class="score-red">RED: <span id="ai-score">0</span></span>
    </div>

    <div id="tv-replay-badge">
        <div id="tv-rec-dot"></div>
        <span id="tv-cam-name">BEHIND-THE-NET CAM</span>
        <span id="tv-slomo-tag">SLOW-MO 0.5x</span>
    </div>

    <!-- Stats & Highlight Vault Modal -->
    <div id="vault-modal">
        <div id="vault-header">
            <span id="vault-title">MATCH LOG & HIGHLIGHTS</span>
            <span id="vault-score-summary">BLUE 0 - 0 RED</span>
        </div>
        <div id="stats-grid">
            <div class="stats-row">
                <span class="stats-val-player" id="stat-p-goals">0</span>
                <span class="stats-label">Goals</span>
                <span class="stats-val-ai" id="stat-a-goals">0</span>
            </div>
            <div class="stats-row">
                <span class="stats-val-player" id="stat-p-shots">0</span>
                <span class="stats-label">Shots</span>
                <span class="stats-val-ai" id="stat-a-shots">0</span>
            </div>
            <div class="stats-row">
                <span class="stats-val-player" id="stat-p-corners">0</span>
                <span class="stats-label">Corners</span>
                <span class="stats-val-ai" id="stat-a-corners">0</span>
            </div>
            <div class="stats-row">
                <span class="stats-val-player" id="stat-p-throws">0</span>
                <span class="stats-label">Throw-Ins</span>
                <span class="stats-val-ai" id="stat-a-throws">0</span>
            </div>
        </div>
        <div id="vault-tabs">
            <button class="vault-tab-btn active" onclick="switchVaultCategory('MY_GOALS')">⚽ Blue Goals (<span id="count-my-goals">0</span>)</button>
            <button class="vault-tab-btn" onclick="switchVaultCategory('AI_GOALS')">🔴 Red Goals (<span id="count-ai-goals">0</span>)</button>
            <button class="vault-tab-btn" onclick="switchVaultCategory('CROSSES')">🚩 Corners (<span id="count-crosses">0</span>)</button>
            <button class="vault-tab-btn" onclick="switchVaultCategory('THROWS')">👐 Throws (<span id="count-throws">0</span>)</button>
        </div>
        <div id="vault-content-list"></div>
        <div id="vault-footer">
            <button class="vault-btn" onclick="closeVaultModal()">Return to Pitch</button>
        </div>
    </div>

    <div id="bottom-controls">
        <div class="hud-circle-btn" onclick="openVaultModal()" title="Match Stats & Replays">L</div>
    </div>

    <div id="power-bar-container"><div id="power-bar-fill"></div></div>
    <div id="announcement-banner">KICK OFF!</div>

    <script>
        const socket = io();
        let currentRoomName = null;
        let myTeam = 'BLUE';
        let isAuthoritativeHost = true;
        let isGameStarted = false;

        const statusText = document.getElementById('status-text');
        const roomInfoText = document.getElementById('room-info-text');
        const spinner = document.getElementById('spinner');
        const readyBtn = document.getElementById('ready-btn');
        const readyRow = document.getElementById('ready-status-row');
        const blueBadge = document.getElementById('blue-ready-badge');
        const redBadge = document.getElementById('red-ready-badge');

        socket.on('connect', () => {
            statusText.innerText = 'SEARCHING FOR OPPONENT...';
            socket.emit('find_match');
        });

        socket.on('matchmaking_status', (msg) => { statusText.innerText = msg; });

        socket.on('match_found', (data) => {
            currentRoomName = data.roomName;
            myTeam = data.team;
            isAuthoritativeHost = (data.role === 'HOST');

            spinner.style.display = 'none';
            statusText.innerText = 'OPPONENT SEATED ACROSS!';
            roomInfoText.innerText = `${currentRoomName.toUpperCase()} • YOU ARE ${myTeam}`;
            roomInfoText.style.display = 'block';
            
            readyRow.style.display = 'flex';
            readyBtn.style.display = 'block';
            document.getElementById('active-room-tag').innerText = `${currentRoomName} | ${myTeam}`;
        });

        function sendReady() {
            readyBtn.disabled = true;
            readyBtn.innerText = 'WAITING FOR OPPONENT...';
            socket.emit('player_ready', currentRoomName);
        }

        socket.on('ready_update', (data) => {
            if (data.hostReady) {
                blueBadge.innerText = 'BLUE: READY';
                blueBadge.classList.add('is-ready');
            }
            if (data.guestReady) {
                redBadge.innerText = 'RED: READY';
                redBadge.classList.add('is-ready');
            }
        });

        socket.on('start_countdown', () => {
            let count = 3;
            readyBtn.innerText = `STARTING IN ${count}...`;
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    readyBtn.innerText = `STARTING IN ${count}...`;
                } else {
                    clearInterval(interval);
                    document.getElementById('matchmaking-overlay').style.display = 'none';
                    isGameStarted = true;
                    initEngine();
                    showBanner("KICK OFF!");
                }
            }, 1000);
        });

        socket.on('server_state_update', (state) => {
            if (!isAuthoritativeHost && isGameStarted && !isReplayMode) {
                ball.targetPos.set(state.ball.x, state.ball.y, state.ball.z);
                ball.velocity.set(state.ball.vx, state.ball.vy, state.ball.vz);
                ball.isAerial = state.ball.isAerial;

                state.players.forEach((p, idx) => {
                    if (players[idx]) {
                        players[idx].targetPos.set(p.x, p.y, p.z);
                        players[idx].velocity.set(p.vx, 0, p.vz);
                    }
                });

                playerScore = state.scores.blue;
                aiScore = state.scores.red;
                document.getElementById('player-score').innerText = playerScore;
                document.getElementById('ai-score').innerText = aiScore;

                isSetPieceActive = state.setPiece.active;
                setPieceTeam = state.setPiece.team;
                setPieceType = state.setPiece.type;
                if (setPieceExclusionRing) {
                    setPieceExclusionRing.visible = isSetPieceActive;
                    if (isSetPieceActive && state.setPiece.ringPos) {
                        setPieceExclusionRing.position.set(state.setPiece.ringPos.x, 0.04, state.setPiece.ringPos.z);
                    }
                }
            }
        });

        socket.on('receive_player_action', (action) => {
            if (action.isAerial) {
                executeAerialDelivery(new THREE.Vector3(action.origin.x, action.origin.y, action.origin.z), new THREE.Vector3(action.dir.x, action.dir.y, action.dir.z), action.power);
            } else {
                const targetPlayer = players[action.playerIndex];
                if (targetPlayer) {
                    targetPlayer.velocity.set(action.impulse.x, 0, action.impulse.z);
                }
            }
        });

        socket.on('opponent_disconnected', () => {
            alert("Opponent disconnected. Re-entering matchmaking...");
            window.location.reload();
        });

        // --- 3D Scene & Engine ---
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const cameraVelocity = new THREE.Vector3();
        const cameraDirection = new THREE.Vector3();
        const mousePointer = new THREE.Vector2(-10, -10);
        const raycaster = new THREE.Raycaster();

        const pitchWidth = 40, pitchDepth = 60;
        const sidelineX = 18.5, endlineZ = 28.5;
        const goalWidth = 10, goalDepth = 4, goalHeight = 3.5;
        let terrainMesh, ball = null;
        const players = [];

        let playerScore = 0, aiScore = 0;
        let powerBarContainer, powerBarFill, banner;
        let matchClockElem, matchStatusElem, canvasContainerElem;
        let tvReplayBadge, tvCamNameElem, vaultModalElem;

        const matchStats = { playerShots: 0, aiShots: 0, playerCorners: 0, aiCorners: 0, playerThrows: 0, aiThrows: 0 };
        const TOTAL_REAL_TIME = 540.0;
        let remainingRealTime = TOTAL_REAL_TIME;
        let currentHalf = 1;
        let isGameOver = false;

        let selectedPlayer = null, hoveredPlayer = null, isAiming = false;
        let chargePower = 0;
        const maxDragDistance = 14.0;
        let aimDirection = new THREE.Vector3();
        let impactArrowGroup, arrowShaftMesh, arrowTipMesh;

        // Touch Flick Dynamic Variables
        let touchStartTime = 0;
        let touchStartPos = new THREE.Vector3();
        let currentDragPoint = new THREE.Vector3();

        let isPlayPaused = false;
        let isSetPieceActive = false;
        let setPieceType = null;
        let setPieceTeam = 'BLUE';
        let setPieceTaker = null;
        let setPieceExclusionRing = null;
        const setPieceBufferRadius = 6.0;
        let lastTouchedTeam = 'BLUE';

        const categorizedArchive = { MY_GOALS: [], AI_GOALS: [], CROSSES: [], THROWS: [] };
        let currentVaultTab = 'MY_GOALS';
        const ROLLING_BUFFER_MAX = 210;
        const rollingBuffer = [];

        let isReplayMode = false;
        let activeReplayFrames = [];
        let replayPlaybackIdx = 0;
        let liveStateRestoreSnapshot = null;
        let currentReplayCameraConfig = null;

        const COLOR_BLUE_NORMAL = 0x2563eb;
        const COLOR_BLUE_ACTIVE = 0x0f2d7a;
        const COLOR_RED_NORMAL = 0xdc2626;
        const COLOR_RED_ACTIVE = 0x6b0d0d;

        function initEngine() {
            powerBarContainer = document.getElementById('power-bar-container');
            powerBarFill = document.getElementById('power-bar-fill');
            banner = document.getElementById('announcement-banner');
            matchClockElem = document.getElementById('match-clock');
            matchStatusElem = document.getElementById('match-status-badge');
            canvasContainerElem = document.getElementById('canvas-container');
            tvReplayBadge = document.getElementById('tv-replay-badge');
            tvCamNameElem = document.getElementById('tv-cam-name');
            vaultModalElem = document.getElementById('vault-modal');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            if (myTeam === 'RED') {
                camera.position.set(0, 56, -44);
                camera.lookAt(new THREE.Vector3(0, -2, -2));
            } else {
                camera.position.set(0, 56, 44);
                camera.lookAt(new THREE.Vector3(0, -2, 2));
            }

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            canvasContainerElem.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const spotLight = new THREE.DirectionalLight(0xffffff, 0.85);
            spotLight.position.set(20, 60, 20);
            spotLight.castShadow = true;
            scene.add(spotLight);

            createPitch();
            createGoals();
            createBall();
            createTeams();
            createArrowIndicator();
            createSetPieceVisualHelpers();

            window.addEventListener('resize', onWindowResize);
            
            // Unified Cross-Platform Pointer Events (Touch, Pen & Mouse)
            canvasContainerElem.addEventListener('pointerdown', onPointerDown, { passive: false });
            window.addEventListener('pointermove', onPointerMove, { passive: false });
            window.addEventListener('pointerup', onPointerUp, { passive: false });
            window.addEventListener('pointercancel', onPointerUp, { passive: false });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            canvasContainerElem.addEventListener('contextmenu', e => e.preventDefault());

            animate();
        }

        function createPitch() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1536;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e7b34'; ctx.fillRect(0, 0, 1024, 1536);
            ctx.fillStyle = '#238c3c';
            for (let i = 0; i < 1536; i += 128) ctx.fillRect(0, i, 1024, 64);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10;
            ctx.strokeRect(40, 40, 944, 1456);
            ctx.beginPath(); ctx.moveTo(40, 768); ctx.lineTo(984, 768); ctx.stroke();
            ctx.beginPath(); ctx.arc(512, 768, 140, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(512, 768, 8, 0, Math.PI * 2); ctx.fill();
            ctx.strokeRect(262, 40, 500, 240);
            ctx.strokeRect(262, 1256, 500, 240);

            const pitchTexture = new THREE.CanvasTexture(canvas);
            terrainMesh = new THREE.Mesh(new THREE.PlaneGeometry(pitchWidth, pitchDepth).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: pitchTexture, roughness: 0.85 }));
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x2e1802, roughness: 0.7 });
            const borderThickness = 1.2, borderHeight = 1.5;
            const leftBorder = new THREE.Mesh(new THREE.BoxGeometry(borderThickness, borderHeight, pitchDepth + 2), frameMat);
            leftBorder.position.set(-pitchWidth/2 - borderThickness/2 - 1.2, borderHeight/2, 0);
            scene.add(leftBorder);
            const rightBorder = leftBorder.clone();
            rightBorder.position.x = pitchWidth/2 + borderThickness/2 + 1.2;
            scene.add(rightBorder);
        }

        function createGoals() {
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.35 });

            [-1, 1].forEach(side => {
                const goalGroup = new THREE.Group();
                const postL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, goalHeight), frameMat);
                postL.position.set(-goalWidth/2, goalHeight/2, 0);
                const postR = postL.clone(); postR.position.x = goalWidth/2;
                const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, goalWidth).rotateZ(Math.PI/2), frameMat);
                crossbar.position.set(0, goalHeight, 0);
                const net = new THREE.Mesh(new THREE.BoxGeometry(goalWidth, goalHeight, goalDepth), netMat);
                net.position.set(0, goalHeight/2, -side * goalDepth/2);

                goalGroup.add(postL, postR, crossbar, net);
                goalGroup.position.set(0, 0, side * (pitchDepth/2));
                if (side === 1) goalGroup.rotation.y = Math.PI;
                scene.add(goalGroup);
            });
        }

        function createBall() {
            const geo = new THREE.SphereGeometry(0.65, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.position.set(0, 0.65, 0);
            scene.add(mesh);
            ball = { 
                mesh: mesh, 
                radius: 0.65, 
                velocity: new THREE.Vector3(0,0,0),
                targetPos: new THREE.Vector3(0, 0.65, 0),
                isAerial: false,
                flightProgress: 0,
                flightDuration: 0,
                flightStart: new THREE.Vector3(),
                flightEnd: new THREE.Vector3(),
                peakHeight: 0
            };
        }

        function createSubbuteoFigure(teamColorHex, ringColorHex) {
            const group = new THREE.Group();
            const baseGeo = new THREE.CylinderGeometry(1.0, 0.8, 0.35, 24);
            const baseMat = new THREE.MeshStandardMaterial({ color: teamColorHex, roughness: 0.3, metalness: 0.1 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.175;
            group.add(base);

            const figureGeo = new THREE.BoxGeometry(0.7, 1.4, 0.08);
            const figureMat = new THREE.MeshStandardMaterial({ color: teamColorHex, roughness: 0.5 });
            const figure = new THREE.Mesh(figureGeo, figureMat);
            figure.position.y = 1.0;
            group.add(figure);

            const ringGeo = new THREE.RingGeometry(1.05, 1.25, 24).rotateX(-Math.PI/2);
            const ringMat = new THREE.MeshBasicMaterial({ color: ringColorHex, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = 0.04; ring.visible = true;
            group.add(ring);

            return { group: group, ring: ring, baseMat: baseMat, figureMat: figureMat };
        }

        function createTeams() {
            const posBlue = [{x: 0, z: 26}, {x: -10, z: 16}, {x: 10, z: 16}, {x: -12, z: 7}, {x: 0, z: 8}, {x: 12, z: 7}, {x: -6, z: 1.5}, {x: 6, z: 1.5}];
            const posRed = [{x: 0, z: -26}, {x: -10, z: -16}, {x: 10, z: -16}, {x: -12, z: -7}, {x: 0, z: -8}, {x: 12, z: -7}, {x: -6, z: -1.5}, {x: 6, z: -1.5}];

            posBlue.forEach(p => spawnPlayer(p, 'BLUE', COLOR_BLUE_NORMAL, 0x00aaff));
            posRed.forEach(p => spawnPlayer(p, 'RED', COLOR_RED_NORMAL, 0xff3333));
        }

        function spawnPlayer(pos, team, baseColor, ringColor) {
            const figure = createSubbuteoFigure(baseColor, ringColor);
            figure.group.position.set(pos.x, 0, pos.z);
            scene.add(figure.group);
            players.push({
                mesh: figure.group,
                ring: figure.ring,
                baseMat: figure.baseMat,
                figureMat: figure.figureMat,
                team: team,
                radius: 1.0,
                velocity: new THREE.Vector3(0,0,0),
                targetPos: new THREE.Vector3(pos.x, 0, pos.z)
            });
        }

        function createArrowIndicator() {
            impactArrowGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.2, roughness: 0.3 });
            arrowShaftMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.0, 12).rotateX(Math.PI/2), mat);
            arrowTipMesh = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.9, 12).rotateX(Math.PI/2), mat);
            impactArrowGroup.add(arrowShaftMesh, arrowTipMesh);
            impactArrowGroup.visible = false;
            scene.add(impactArrowGroup);
        }

        function createSetPieceVisualHelpers() {
            const ringGeo = new THREE.RingGeometry(setPieceBufferRadius - 0.1, setPieceBufferRadius, 32).rotateX(-Math.PI/2);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            setPieceExclusionRing = new THREE.Mesh(ringGeo, ringMat);
            setPieceExclusionRing.position.y = 0.05;
            setPieceExclusionRing.visible = false;
            scene.add(setPieceExclusionRing);
        }

        function updateArrowVisuals(length) {
            const tipLen = 0.9;
            const shaftLen = Math.max(0.1, length - tipLen);
            arrowShaftMesh.scale.set(1, shaftLen, 1);
            arrowShaftMesh.position.set(0, 0, shaftLen / 2);
            arrowTipMesh.position.set(0, 0, shaftLen + tipLen / 2);
        }

        function showBanner(text, duration = 1500) {
            banner.innerText = text;
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, duration);
        }

        // --- Grab Hand Cursor Manager ---
        function updateCursorStyle() {
            if (isGameOver || isPlayPaused || isReplayMode || !isGameStarted) {
                canvasContainerElem.style.cursor = 'default';
                return;
            }
            if (isAiming) {
                canvasContainerElem.style.cursor = 'grabbing';
                return;
            }
            if (hoveredPlayer && hoveredPlayer.team === myTeam) {
                if (isSetPieceActive) {
                    if (setPieceTeam === myTeam && hoveredPlayer === setPieceTaker) {
                        canvasContainerElem.style.cursor = 'grab';
                    } else {
                        canvasContainerElem.style.cursor = 'default';
                    }
                } else {
                    canvasContainerElem.style.cursor = 'grab';
                }
            } else {
                canvasContainerElem.style.cursor = 'default';
            }
        }

        // --- Touch Velocity Sensitive Flick & Pointer Engine ---
        function getPointerVector(event) {
            return new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
        }

        function onPointerDown(event) {
            if (isPlayPaused || isGameOver || isReplayMode || !isGameStarted) return;
            event.preventDefault();

            mousePointer.copy(getPointerVector(event));
            raycaster.setFromCamera(mousePointer, camera);

            const hits = raycaster.intersectObjects(players.map(p => p.mesh), true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj.parent && !players.some(p => p.mesh === obj)) obj = obj.parent;
                const hitPlayer = players.find(p => p.mesh === obj);

                if (hitPlayer && hitPlayer.team === myTeam) {
                    if (isSetPieceActive && (setPieceTeam !== myTeam || hitPlayer !== setPieceTaker)) return;
                    
                    selectedPlayer = hitPlayer;
                    isAiming = true;
                    chargePower = 0;
                    touchStartTime = performance.now();
                    touchStartPos.copy(selectedPlayer.mesh.position);
                    currentDragPoint.copy(selectedPlayer.mesh.position);

                    powerBarContainer.style.display = 'block';
                    powerBarFill.style.width = '0%';
                    updateCursorStyle();
                }
            }
        }

        function onPointerMove(event) {
            event.preventDefault();
            mousePointer.copy(getPointerVector(event));
            raycaster.setFromCamera(mousePointer, camera);

            if (!isAiming) {
                const hits = raycaster.intersectObjects(players.map(p => p.mesh), true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj.parent && !players.some(p => p.mesh === obj)) obj = obj.parent;
                    hoveredPlayer = players.find(p => p.mesh === obj) || null;
                } else hoveredPlayer = null;
                updateCursorStyle();
            } else if (selectedPlayer) {
                const intersects = raycaster.intersectObject(terrainMesh);
                if (intersects.length > 0) {
                    const pt = intersects[0].point;
                    currentDragPoint.copy(pt);

                    const dragVector = new THREE.Vector3().subVectors(pt, selectedPlayer.mesh.position).setY(0);
                    const distance = dragVector.length();

                    if (distance > 0.3) {
                        aimDirection.copy(dragVector).normalize();
                        const clampedDist = Math.min(distance, maxDragDistance);
                        
                        // Drag Distance Power Percentage
                        chargePower = (clampedDist / maxDragDistance) * 100;
                        powerBarFill.style.width = chargePower + '%';

                        impactArrowGroup.visible = true;
                        impactArrowGroup.position.copy(selectedPlayer.mesh.position).y += (isSetPieceActive && setPieceType === 'THROW_IN' ? 1.4 : 0.25);
                        const lookTarget = selectedPlayer.mesh.position.clone().add(aimDirection).add(new THREE.Vector3(0, (isSetPieceActive && setPieceType === 'THROW_IN' ? 1.4 : 0.25), 0));
                        impactArrowGroup.lookAt(lookTarget);

                        const visualLength = Math.max(1.2, clampedDist * 0.9);
                        updateArrowVisuals(visualLength);
                    } else {
                        chargePower = 0;
                        powerBarFill.style.width = '0%';
                        impactArrowGroup.visible = false;
                    }
                }
            }
        }

        function onPointerUp(event) {
            if (isAiming && selectedPlayer) {
                isAiming = false;
                powerBarContainer.style.display = 'none';
                impactArrowGroup.visible = false;

                const touchDuration = Math.max(20, performance.now() - touchStartTime) / 1000; // in seconds
                const dragVector = new THREE.Vector3().subVectors(currentDragPoint, selectedPlayer.mesh.position).setY(0);
                const dragDist = dragVector.length();

                // Calculate Touch Flick Velocity
                const flickSpeed = dragDist / touchDuration; 
                
                // Combine Drag Length + Touch Flick Speed Sensitivity
                let finalPower = (Math.min(dragDist, maxDragDistance) / maxDragDistance) * 70 + Math.min(30, flickSpeed * 1.2);
                finalPower = Math.min(100, Math.max(0, finalPower));

                if (dragDist > 0.4 && finalPower > 4 && !isGameOver && !isReplayMode) {
                    const pIndex = players.indexOf(selectedPlayer);
                    aimDirection.copy(dragVector).normalize();

                    if (isSetPieceActive && selectedPlayer === setPieceTaker) {
                        executeAerialDelivery(selectedPlayer.mesh.position, aimDirection, finalPower);
                        lastTouchedTeam = myTeam;
                        socket.emit('player_action', {
                            roomName: currentRoomName,
                            action: { isAerial: true, origin: selectedPlayer.mesh.position, dir: aimDirection, power: finalPower }
                        });
                    } else {
                        const impulse = aimDirection.clone().multiplyScalar((finalPower / 100) * 45.0);
                        selectedPlayer.velocity.copy(impulse);
                        lastTouchedTeam = myTeam;
                        if (myTeam === 'BLUE' && aimDirection.z < -0.6) matchStats.playerShots++;
                        if (myTeam === 'RED' && aimDirection.z > 0.6) matchStats.aiShots++;

                        socket.emit('player_action', {
                            roomName: currentRoomName,
                            action: { isAerial: false, playerIndex: pIndex, impulse: { x: impulse.x, z: impulse.z } }
                        });
                    }
                }
                selectedPlayer = null;
                updateCursorStyle();
            }
        }

        // --- Set Pieces & Anti-Bash Buffer Rings ---
        function setupSetPiecePosition(type, awardedTeam, spotX, spotZ, bannerText) {
            isPlayPaused = true;
            isSetPieceActive = true;
            setPieceType = type;
            setPieceTeam = awardedTeam;
            ball.velocity.set(0,0,0);
            ball.isAerial = false;
            ball.mesh.position.set(spotX, 0.65, spotZ);

            players.forEach(p => p.velocity.set(0,0,0));
            const eligiblePlayers = players.filter(p => p.team === awardedTeam);
            let taker = eligiblePlayers[0], minDist = Infinity;
            eligiblePlayers.forEach(p => {
                const d = p.mesh.position.distanceTo(ball.mesh.position);
                if (d < minDist) { minDist = d; taker = p; }
            });

            setPieceTaker = taker;
            const dirToCenter = new THREE.Vector3(0, 0, 0).sub(ball.mesh.position).setY(0).normalize();
            taker.mesh.position.copy(ball.mesh.position).addScaledVector(dirToCenter, -1.5);

            // Anti-Bash exclusion ring logic
            const defendingTeam = (awardedTeam === 'BLUE') ? 'RED' : 'BLUE';
            players.forEach(p => {
                if (p.team === defendingTeam) {
                    const distToThrow = p.mesh.position.distanceTo(taker.mesh.position);
                    if (distToThrow < setPieceBufferRadius) {
                        const pushDir = new THREE.Vector3().subVectors(p.mesh.position, taker.mesh.position).setY(0).normalize();
                        if (pushDir.lengthSq() === 0) pushDir.copy(dirToCenter);
                        p.mesh.position.copy(taker.mesh.position).addScaledVector(pushDir, setPieceBufferRadius + 0.8);
                        p.mesh.position.x = Math.max(-sidelineX + 1, Math.min(sidelineX - 1, p.mesh.position.x));
                        p.mesh.position.z = Math.max(-27, Math.min(27, p.mesh.position.z));
                    }
                }
            });

            setPieceExclusionRing.position.copy(taker.mesh.position).setY(0.04);
            setPieceExclusionRing.visible = true;

            showBanner(bannerText, 1300);
            setTimeout(() => { if (!isGameOver) isPlayPaused = false; }, 600);
        }

        function awardThrowIn(touchX, touchZ, awardedTeam) {
            if (awardedTeam === 'BLUE') matchStats.playerThrows++;
            else matchStats.aiThrows++;
            const spotX = Math.sign(touchX) * (sidelineX - 0.2);
            const spotZ = Math.max(-27, Math.min(27, touchZ));
            logMatchAction('THROW', `${awardedTeam === 'BLUE' ? 'Blue' : 'Red'} Throw-In`, 'badge-throw', 'THROWS', spotX, spotZ);
            setupSetPiecePosition('THROW_IN', awardedTeam, spotX, spotZ, `THROW IN!\n${awardedTeam} BALL`);
        }

        function awardCornerKick(cornerXSign, cornerZSign, awardedTeam) {
            if (awardedTeam === 'BLUE') matchStats.playerCorners++;
            else matchStats.aiCorners++;
            const spotX = cornerXSign * (sidelineX - 0.5);
            const spotZ = cornerZSign * (endlineZ - 0.5);
            logMatchAction('CORNER', `${awardedTeam === 'BLUE' ? 'Blue' : 'Red'} Corner Kick`, 'badge-corner', 'CROSSES', spotX, spotZ);
            setupSetPiecePosition('CORNER', awardedTeam, spotX, spotZ, `CORNER KICK!\n${awardedTeam} CORNER`);
        }

        function awardGoalKick(endZSign, awardedTeam) {
            const spotX = (Math.random() > 0.5 ? 1 : -1) * 3.5;
            const spotZ = endZSign * (endlineZ - 8.0);
            setupSetPiecePosition('GOAL_KICK', awardedTeam, spotX, spotZ, `GOAL KICK!\n${awardedTeam} KICK`);
        }

        function executeAerialDelivery(originPos, targetDir, powerPercent) {
            isSetPieceActive = false;
            setPieceExclusionRing.visible = false;
            setPieceTaker = null;

            const isCorner = (setPieceType === 'CORNER');
            const throwDistance = isCorner ? (12.0 + (powerPercent / 100) * 22.0) : (6.0 + (powerPercent / 100) * 18.0);
            const flightTime = 0.55 + (throwDistance / 24.0) * 0.45;

            ball.isAerial = true;
            ball.flightProgress = 0;
            ball.flightDuration = flightTime;
            ball.flightStart.copy(originPos).setY(setPieceType === 'THROW_IN' ? 1.4 : 0.65);
            ball.flightEnd.copy(originPos).addScaledVector(targetDir, throwDistance).setY(0.65);
            ball.flightEnd.x = Math.max(-sidelineX + 0.5, Math.min(sidelineX - 0.5, ball.flightEnd.x));
            ball.flightEnd.z = Math.max(-28, Math.min(28, ball.flightEnd.z));
            ball.peakHeight = isCorner ? (4.5 + (powerPercent / 100) * 4.5) : (3.5 + (powerPercent / 100) * 4.5);
            ball.velocity.copy(targetDir).multiplyScalar((powerPercent / 100) * 8.0);
        }

        // --- Highlight Recording & Broadcast Cameras ---
        function recordRollingFrame() {
            if (isReplayMode) return;
            rollingBuffer.push({
                ballPos: ball.mesh.position.clone(),
                ballVel: ball.velocity.clone(),
                ballAerial: ball.isAerial,
                players: players.map(p => ({ pos: p.mesh.position.clone(), vel: p.velocity.clone() }))
            });
            if (rollingBuffer.length > ROLLING_BUFFER_MAX) rollingBuffer.shift();
        }

        function logMatchAction(type, label, badgeClass, category, spotX = 0, spotZ = 0) {
            if (rollingBuffer.length < 15) return;
            const record = {
                type: type, label: label, badgeClass: badgeClass,
                time: matchClockElem.innerText,
                clip: JSON.parse(JSON.stringify(rollingBuffer)),
                spotX: spotX, spotZ: spotZ
            };
            if (category && categorizedArchive[category]) categorizedArchive[category].push(record);
        }

        function determineReplayCamera(item) {
            const lastFrame = item.clip[item.clip.length - 1];
            const ballZ = lastFrame ? lastFrame.ballPos.z : (item.spotZ || 0);

            if (item.type === 'GOAL') {
                if (ballZ < 0) {
                    return { camName: "BEHIND-THE-NET CAM", startPos: new THREE.Vector3(0, 1.8, -34.5), endPos: new THREE.Vector3(0, 3.2, -31.0), lookTarget: new THREE.Vector3(0, 0.8, -24.0), fov: 52 };
                } else {
                    return { camName: "GOALMOUTH ISO CAM", startPos: new THREE.Vector3(0, 1.8, 34.5), endPos: new THREE.Vector3(0, 3.2, 31.0), lookTarget: new THREE.Vector3(0, 0.8, 24.0), fov: 52 };
                }
            } else if (item.type === 'CORNER') {
                return { camName: "CORNER FLAG CAM", startPos: new THREE.Vector3(23.5, 2.2, ballZ), endPos: new THREE.Vector3(20, 3.8, ballZ), lookTarget: new THREE.Vector3(0, 1.2, (ballZ < 0 ? -18 : 18)), fov: 48 };
            } else {
                return { camName: "TOUCHLINE CAM", startPos: new THREE.Vector3(24.0, 2.0, ballZ - 7.0), endPos: new THREE.Vector3(21, 3.4, ballZ + 7.0), lookTarget: new THREE.Vector3(0, 1.0, ballZ), fov: 46 };
            }
        }

        function playBroadcastHighlight(item) {
            if (isReplayMode || !item || !item.clip || item.clip.length === 0) return;
            liveStateRestoreSnapshot = {
                ballPos: ball.mesh.position.clone(), ballVel: ball.velocity.clone(), ballAerial: ball.isAerial,
                players: players.map(p => ({ pos: p.mesh.position.clone(), vel: p.velocity.clone() })),
                camPos: camera.position.clone(), camFov: camera.fov
            };

            currentReplayCameraConfig = determineReplayCamera(item);
            isReplayMode = true;
            activeReplayFrames = item.clip;
            replayPlaybackIdx = 0;

            document.body.classList.add('in-replay');
            tvCamNameElem.innerText = currentReplayCameraConfig.camName;
            tvReplayBadge.style.display = 'flex';
            camera.fov = currentReplayCameraConfig.fov;
            camera.updateProjectionMatrix();
        }

        function updateReplayModePlayback() {
            if (!isReplayMode) return;
            const frame = activeReplayFrames[Math.floor(replayPlaybackIdx)];
            if (frame) {
                ball.mesh.position.copy(frame.ballPos);
                frame.players.forEach((pData, idx) => {
                    if (players[idx]) players[idx].mesh.position.copy(pData.pos);
                });
            }

            if (currentReplayCameraConfig) {
                const progress = Math.min(1.0, replayPlaybackIdx / activeReplayFrames.length);
                camera.position.lerpVectors(currentReplayCameraConfig.startPos, currentReplayCameraConfig.endPos, progress);
                const dynamicLook = new THREE.Vector3().lerpVectors(ball.mesh.position, currentReplayCameraConfig.lookTarget, 0.45);
                camera.lookAt(dynamicLook);
            }

            replayPlaybackIdx += 0.5; // Slow-mo 0.5x

            if (replayPlaybackIdx >= activeReplayFrames.length) {
                if (liveStateRestoreSnapshot) {
                    ball.mesh.position.copy(liveStateRestoreSnapshot.ballPos);
                    ball.velocity.copy(liveStateRestoreSnapshot.ballVel);
                    ball.isAerial = liveStateRestoreSnapshot.ballAerial;
                    liveStateRestoreSnapshot.players.forEach((pData, idx) => {
                        if (players[idx]) {
                            players[idx].mesh.position.copy(pData.pos);
                            players[idx].velocity.copy(pData.vel);
                        }
                    });
                    camera.position.copy(liveStateRestoreSnapshot.camPos);
                    camera.fov = liveStateRestoreSnapshot.camFov;
                    camera.updateProjectionMatrix();
                    liveStateRestoreSnapshot = null;
                }
                isReplayMode = false;
                document.body.classList.remove('in-replay');
                tvReplayBadge.style.display = 'none';
                openVaultModal();
            }
        }

        // --- Vault UI ---
        function openVaultModal() {
            document.getElementById('vault-score-summary').innerText = `BLUE ${playerScore} - ${aiScore} RED`;
            document.getElementById('stat-p-goals').innerText = playerScore;
            document.getElementById('stat-a-goals').innerText = aiScore;
            document.getElementById('stat-p-shots').innerText = matchStats.playerShots;
            document.getElementById('stat-a-shots').innerText = matchStats.aiShots;
            document.getElementById('stat-p-corners').innerText = matchStats.playerCorners;
            document.getElementById('stat-a-corners').innerText = matchStats.aiCorners;
            document.getElementById('stat-p-throws').innerText = matchStats.playerThrows;
            document.getElementById('stat-a-throws').innerText = matchStats.aiThrows;
            document.getElementById('count-my-goals').innerText = categorizedArchive.MY_GOALS.length;
            document.getElementById('count-ai-goals').innerText = categorizedArchive.AI_GOALS.length;
            document.getElementById('count-crosses').innerText = categorizedArchive.CROSSES.length;
            document.getElementById('count-throws').innerText = categorizedArchive.THROWS.length;
            renderVaultCategoryList();
            vaultModalElem.style.display = 'flex';
        }
        function closeVaultModal() { vaultModalElem.style.display = 'none'; }
        function switchVaultCategory(category) {
            currentVaultTab = category;
            const buttons = document.querySelectorAll('.vault-tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const tabMap = { 'MY_GOALS': 0, 'AI_GOALS': 1, 'CROSSES': 2, 'THROWS': 3 };
            if (buttons[tabMap[category]]) buttons[tabMap[category]].classList.add('active');
            renderVaultCategoryList();
        }
        function renderVaultCategoryList() {
            const listElem = document.getElementById('vault-content-list');
            listElem.innerHTML = '';
            const items = categorizedArchive[currentVaultTab] || [];
            if (items.length === 0) {
                listElem.innerHTML = '<div style="color:#64748b; font-size:11px; font-style:italic; text-align:center; padding:12px;">No recorded events yet.</div>';
                return;
            }
            items.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'replay-item';
                row.innerHTML = `
                    <span><strong>${item.time}</strong> ${item.label}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="replay-item-badge ${item.badgeClass}">${item.type}</span>
                        <span style="color:#00ffcc; font-weight:bold; font-size:9px;">▶ REPLAY</span>
                    </div>`;
                row.onclick = () => { closeVaultModal(); playBroadcastHighlight(item); };
                listElem.appendChild(row);
            });
        }

        // --- Visual Indicators & Timer ---
        function updatePlayerVisualStates() {
            players.forEach(p => {
                const isMoving = p.velocity.lengthSq() > 0.04;
                if (p.team === 'BLUE') {
                    const isActive = (selectedPlayer === p) || isMoving;
                    const color = isActive ? COLOR_BLUE_ACTIVE : COLOR_BLUE_NORMAL;
                    p.baseMat.color.setHex(color);
                    p.figureMat.color.setHex(color);
                    p.ring.visible = (!isPlayPaused && !isGameOver && !isReplayMode && (!isSetPieceActive || (p === setPieceTaker && setPieceTeam === 'BLUE')) && !isMoving);
                } else {
                    const isActive = (selectedPlayer === p) || isMoving;
                    const color = isActive ? COLOR_RED_ACTIVE : COLOR_RED_NORMAL;
                    p.baseMat.color.setHex(color);
                    p.figureMat.color.setHex(color);
                    p.ring.visible = (!isPlayPaused && !isGameOver && !isReplayMode && (!isSetPieceActive || (p === setPieceTaker && setPieceTeam === 'RED')) && !isMoving);
                }
            });
        }

        function updateMatchTimer(delta) {
            if (isGameOver || isPlayPaused || isReplayMode) return;
            remainingRealTime -= delta;
            if (currentHalf === 1 && remainingRealTime <= TOTAL_REAL_TIME / 2) {
                currentHalf = 2;
                matchStatusElem.innerText = '2ND HALF';
                showBanner('HALF TIME!\n2ND HALF KICK OFF', 2000);
                resetPitchAfterGoal();
            }
            if (remainingRealTime <= 0) {
                remainingRealTime = 0;
                isGameOver = true;
                matchStatusElem.innerText = 'FULL TIME';
                const finalResult = playerScore > aiScore ? 'BLUE VICTORY!' : (playerScore < aiScore ? 'RED VICTORY!' : 'DRAW!');
                showBanner(`FULL TIME!\n${finalResult}`, 3500);
                setTimeout(() => openVaultModal(), 2000);
            }
            const matchSecondsRemaining = remainingRealTime * 10;
            const mins = Math.floor(matchSecondsRemaining / 60);
            const secs = Math.floor(matchSecondsRemaining % 60);
            matchClockElem.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function resetPitchAfterGoal() {
            isPlayPaused = true;
            isSetPieceActive = false;
            if (setPieceExclusionRing) setPieceExclusionRing.visible = false;
            ball.velocity.set(0,0,0);
            ball.isAerial = false;
            ball.mesh.position.set(0, 0.65, 0);

            const posBlue = [{x: 0, z: 26}, {x: -10, z: 16}, {x: 10, z: 16}, {x: -12, z: 7}, {x: 0, z: 8}, {x: 12, z: 7}, {x: -6, z: 1.5}, {x: 6, z: 1.5}];
            const posRed = [{x: 0, z: -26}, {x: -10, z: -16}, {x: 10, z: -16}, {x: -12, z: -7}, {x: 0, z: -8}, {x: 12, z: -7}, {x: -6, z: -1.5}, {x: 6, z: -1.5}];
            players.forEach((p, i) => {
                p.velocity.set(0,0,0);
                const pos = (p.team === 'BLUE') ? posBlue[i] : posRed[i - 8];
                p.mesh.position.set(pos.x, 0, pos.z);
            });
            setTimeout(() => { if (!isGameOver) isPlayPaused = false; }, 1200);
        }

        // --- Relative Pan Controls ---
        function onKeyDown(e) {
            if (myTeam === 'RED') {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveBackward = true;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveForward = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveLeft = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveRight = true;
            } else {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveLeft = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveRight = true;
            }
        }
        function onKeyUp(e) {
            if (myTeam === 'RED') {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveBackward = false;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveForward = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveLeft = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveRight = false;
            } else {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveLeft = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveRight = false;
            }
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Physics & Collision Matrix ---
        function updatePhysics(delta) {
            if (isReplayMode) return;
            const allEntities = [...players];

            if (ball.isAerial) {
                ball.flightProgress += delta / ball.flightDuration;
                const t = ball.flightProgress;
                if (t >= 1.0) {
                    ball.isAerial = false;
                    ball.mesh.position.copy(ball.flightEnd);
                } else {
                    const currentX = THREE.MathUtils.lerp(ball.flightStart.x, ball.flightEnd.x, t);
                    const currentZ = THREE.MathUtils.lerp(ball.flightStart.z, ball.flightEnd.z, t);
                    const arcY = Math.sin(t * Math.PI) * ball.peakHeight;
                    ball.mesh.position.set(currentX, 0.65 + arcY, currentZ);
                }
            } else {
                allEntities.push(ball);
            }

            allEntities.forEach(ent => {
                if (ent.velocity.lengthSq() > 0.03) {
                    ent.mesh.position.addScaledVector(ent.velocity, delta);
                    ent.velocity.multiplyScalar(Math.exp(-2.6 * delta));
                    const bX = (pitchWidth / 2) - ent.radius;
                    const bZ = (pitchDepth / 2) - ent.radius;
                    if (Math.abs(ent.mesh.position.x) > bX) {
                        ent.mesh.position.x = Math.sign(ent.mesh.position.x) * bX;
                        ent.velocity.x *= -0.5;
                    }
                    if (Math.abs(ent.mesh.position.z) > bZ && Math.abs(ent.mesh.position.x) > goalWidth/2) {
                        ent.mesh.position.z = Math.sign(ent.mesh.position.z) * bZ;
                        ent.velocity.z *= -0.5;
                    }
                } else ent.velocity.set(0,0,0);
            });

            // Player to Ball Collisions
            if (!ball.isAerial) {
                players.forEach(p => {
                    const dist = p.mesh.position.distanceTo(ball.mesh.position);
                    const minDist = p.radius + ball.radius;
                    if (dist < minDist && dist > 0.0001) {
                        lastTouchedTeam = p.team;
                        const norm = new THREE.Vector3().subVectors(ball.mesh.position, p.mesh.position).setY(0).normalize();
                        const overlap = minDist - dist;
                        ball.mesh.position.addScaledVector(norm, overlap);
                        const relVel = new THREE.Vector3().subVectors(p.velocity, ball.velocity);
                        const speed = relVel.dot(norm);
                        if (speed > 0) {
                            ball.velocity.addScaledVector(norm, speed * 1.55);
                            p.velocity.addScaledVector(norm, -speed * 0.4);
                        }
                    }
                });
            }

            // Figure to Figure Collisions (Solid Anti-Ghosting)
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    const p1 = players[i], p2 = players[j];
                    const dist = p1.mesh.position.distanceTo(p2.mesh.position);
                    const minDist = p1.radius + p2.radius;
                    if (dist < minDist && dist > 0.0001) {
                        const norm = new THREE.Vector3().subVectors(p2.mesh.position, p1.mesh.position).setY(0).normalize();
                        const overlap = (minDist - dist) * 0.5;
                        p1.mesh.position.addScaledVector(norm, -overlap);
                        p2.mesh.position.addScaledVector(norm, overlap);

                        const relVel = new THREE.Vector3().subVectors(p1.velocity, p2.velocity);
                        const speed = relVel.dot(norm);
                        if (speed > 0) {
                            const restitution = 0.05;
                            const impulse = speed * (1 + restitution) * 0.5;
                            p1.velocity.addScaledVector(norm, -impulse);
                            p2.velocity.addScaledVector(norm, impulse * 0.4);
                            p1.velocity.multiplyScalar(0.85);
                            p2.velocity.multiplyScalar(0.85);
                        }
                    }
                }
            }

            if (!isAuthoritativeHost || isPlayPaused || ball.isAerial || isGameOver) return;

            // Goal Checking
            if (Math.abs(ball.mesh.position.z) >= endlineZ) {
                if (Math.abs(ball.mesh.position.x) < (goalWidth / 2) - 0.2) {
                    if (ball.mesh.position.z < 0) {
                        playerScore++;
                        document.getElementById('player-score').innerText = playerScore;
                        logMatchAction('GOAL', 'Goal to Blue!', 'badge-goal', 'MY_GOALS', ball.mesh.position.x, ball.mesh.position.z);
                        showBanner("GOAL BLUE!");
                        resetPitchAfterGoal();
                        return;
                    } else {
                        aiScore++;
                        document.getElementById('ai-score').innerText = aiScore;
                        logMatchAction('GOAL', 'Goal to Red!', 'badge-goal', 'AI_GOALS', ball.mesh.position.x, ball.mesh.position.z);
                        showBanner("GOAL RED!");
                        resetPitchAfterGoal();
                        return;
                    }
                }

                // Endline Out-of-Bounds
                if (!isSetPieceActive) {
                    const isNorthEnd = (ball.mesh.position.z < 0);
                    const cornerXSign = Math.sign(ball.mesh.position.x) || 1;
                    const cornerZSign = Math.sign(ball.mesh.position.z) || 1;
                    if (isNorthEnd) {
                        if (lastTouchedTeam === 'RED') awardCornerKick(cornerXSign, cornerZSign, 'BLUE');
                        else awardGoalKick(-1, 'RED');
                    } else {
                        if (lastTouchedTeam === 'BLUE') awardCornerKick(cornerXSign, cornerZSign, 'RED');
                        else awardGoalKick(1, 'BLUE');
                    }
                    return;
                }
            }

            // Touchline Out-Of-Bounds
            if (Math.abs(ball.mesh.position.x) >= sidelineX && !isSetPieceActive) {
                const awardedTeam = (lastTouchedTeam === 'BLUE') ? 'RED' : 'BLUE';
                awardThrowIn(ball.mesh.position.x, ball.mesh.position.z, awardedTeam);
            }
        }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (!isReplayMode) {
                cameraVelocity.x -= cameraVelocity.x * 10.0 * delta;
                cameraVelocity.z -= cameraVelocity.z * 10.0 * delta;
                cameraDirection.z = Number(moveForward) - Number(moveBackward);
                cameraDirection.x = Number(moveRight) - Number(moveLeft);
                cameraDirection.normalize();
                if (moveForward || moveBackward) cameraVelocity.z -= cameraDirection.z * 120.0 * delta;
                if (moveLeft || moveRight) cameraVelocity.x -= cameraDirection.x * 120.0 * delta;
                camera.position.x += cameraVelocity.x * delta;
                camera.position.z += cameraVelocity.z * delta;

                if (isGameStarted) {
                    updateMatchTimer(delta);
                    updatePhysics(delta);
                    recordRollingFrame();

                    if (isAuthoritativeHost) {
                        socket.emit('sync_state', {
                            roomName: currentRoomName,
                            state: {
                                ball: { 
                                    x: ball.mesh.position.x, y: ball.mesh.position.y, z: ball.mesh.position.z,
                                    vx: ball.velocity.x, vy: ball.velocity.y, vz: ball.velocity.z,
                                    isAerial: ball.isAerial
                                },
                                players: players.map(p => ({ 
                                    x: p.mesh.position.x, y: p.mesh.position.y, z: p.mesh.position.z,
                                    vx: p.velocity.x, vz: p.velocity.z
                                })),
                                scores: { blue: playerScore, red: aiScore },
                                setPiece: {
                                    active: isSetPieceActive,
                                    team: setPieceTeam,
                                    type: setPieceType,
                                    ringPos: setPieceExclusionRing ? { x: setPieceExclusionRing.position.x, z: setPieceExclusionRing.position.z } : null
                                }
                            }
                        });
                    } else {
                        if (!ball.isAerial) ball.mesh.position.lerp(ball.targetPos, 0.25);
                        players.forEach(p => p.mesh.position.lerp(p.targetPos, 0.25));
                    }
                }
            } else {
                updateReplayModePlayback();
            }

            updatePlayerVisualStates();
            updateCursorStyle();
            renderer.render(scene, camera);
            prevTime = time;
        }
    </script>
